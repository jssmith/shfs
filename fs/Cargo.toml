[package]
name = "agent-drive-fs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
env_logger = "0.11.12"
fuse-backend-rs = { version = "0.14.0", features = ["fusedev", "virtiofs"] }
hex = "0.4.3"
libc = "0.2.191"
log = "0.4.35"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3.27.0"
