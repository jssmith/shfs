name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fs
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked
      - run: cargo test --locked
